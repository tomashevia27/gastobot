services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: gastobot
      POSTGRES_PASSWORD: gastobot_local
      POSTGRES_DB: gastobot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastobot -d gastobot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
