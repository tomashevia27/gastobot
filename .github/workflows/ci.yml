name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://gastobot_test:gastobot_test_local@127.0.0.1:5432/gastobot_test?schema=public
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: gastobot_test
          POSTGRES_PASSWORD: gastobot_test_local
          POSTGRES_DB: gastobot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gastobot_test -d gastobot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:validate
      - run: npm run db:test:migrate
      - run: npm run test:integration
      - run: npm run build
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
